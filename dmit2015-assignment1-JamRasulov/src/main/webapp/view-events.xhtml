<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <meta charset="UTF-8"/>
    <title>View events</title>
</h:head>

<h:body>

    <h3>dmit2015-1261 Assignment 1 - jamshid</h3>

    <h2>Campus Events</h2>


    <p:messages showDetail="true"/>

    <h:form id="eventsForm">
        <p:dataTable id="eventsTable"
                     var="event"
                     value="#{campusEventBean.eventList}"
                     emptyMessage="no records of events yet">

            <p:column headerText="Event ID">
                <h:outputText value="#{event.eventId}"/>
            </p:column>

            <p:column headerText="Event name">
                <h:outputText value="#{event.eventName}"/>
            </p:column>

            <p:column headerText="organizer">
                <h:outputText value="#{event.organizerName}"/>
            </p:column>

            <p:column headerText="Event ddate">
                <h:outputText value="#{event.eventDate}"/>
            </p:column>

            <p:column headerText="Capacity">
                <h:outputText value="#{event.capacity}"/>
            </p:column>

            <p:column headerText="Summary">
                <h:outputText value="#{event.eventSummary}"/>
            </p:column>

        </p:dataTable>
    </h:form>

    <h:link outcome="create-event" value="create events"/>

</h:body>
</html>
